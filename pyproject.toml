[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crosshair-bench"
version = "0.1.0"
description = "Zero-contamination spatial reasoning and multi-step lookahead benchmark for LLMs built on Crosshair"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Nick Gustafson", url = "https://thegustafson.com"}
]
dependencies = []

[project.scripts]
crosshair-match = "crosshair_bench.match_runner:main"
crosshair-elo = "crosshair_bench.elo:main"
crosshair-bench100-build = "crosshair_bench.build_bench100:main"
crosshair-bench100-eval = "crosshair_bench.eval_bench100:main"
crosshair-sync-blog = "crosshair_bench.sync_blog:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["crosshair_bench*"]
